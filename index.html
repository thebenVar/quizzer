<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- This page is the same for every quiz. Without ?quiz= it is the home page,
         listing the quizzes named in quizzes/registry.json. With ?quiz=<id> it runs
         that quiz, from quizzes/<id>/meta.json and questions.json; ?quiz=<id>-ans
         shows that quiz's answer key. -->

    <div id="quiz-container">
        <div id="feedback-flash" class="feedback-flash"></div>

        <a id="home-link" href="./" hidden></a>
        <img id="logo" alt="" hidden>
        <h1 id="quiz-title">Loading…</h1>
        <p id="quiz-description" hidden></p>
        <p id="quiz-load-error" class="feedback-incorrect" hidden></p>

        <ul id="quiz-list" hidden></ul>

        <!-- ?quiz=<id>-ans: the answer key (app/answerKey.js) -->
        <div id="answer-key" hidden></div>

        <div id="initial-setup" style="display: none;">
            <div id="name-input-area">
                 <label for="user-name" id="name-label"></label>
                 <input type="text" id="user-name" name="user-name">
            </div>

            <div id="correction-mode-selector">
                <p id="correction-mode-label"></p>
                <label>
                    <input type="radio" name="correction" value="immediate" checked> <span id="immediate-correction-label"></span>
                </label>
                <label>
                    <input type="radio" name="correction" value="end"> <span id="delayed-correction-label"></span>
                </label>
            </div>
            <button id="start-quiz-btn" disabled>Start Quiz</button>
        </div>


        <div id="quiz-content" style="display: none;">
            <div id="quiz-header">
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <div id="header-info">
                    <span id="progress-text"></span> <div id="live-stats">
                        <span id="live-correct-count"></span>
                        <span id="live-incorrect-count"></span>
                        <span id="streak-counter"></span>
                        <div id="live-gifts"></div>
                    </div>
                    <span id="overall-timer"></span>
                </div>
            </div>

            <div id="question-area">
                <p id="question-text"></p>
            </div>

            <div id="options-area">
                </div>

            <div id="feedback-area">
                </div>

            <div id="navigation">
                <button id="submit-btn" style="display: none;"></button>
                <button id="next-question-btn" style="display: none;"><span id="next-question-label"></span> <i class="fas fa-arrow-right"></i></button>
            </div>
        </div> <div id="result-area" style="display: none;">
            <div id="score-card">
                <h2 id="result-heading"></h2>
                <p id="result-message"></p>
                <p><span id="final-score-label"></span> <span id="final-score">0</span> / <span id="total-possible-score">0</span></p>
                <div id="result-summary">
                    <span class="correct-count"><span id="correct-count-label"></span> <span id="correct-answers-count">0</span></span>
                    <span class="incorrect-count"><span id="incorrect-count-label"></span> <span id="incorrect-answers-count">0</span></span>
                </div>
                <p id="time-taken-summary"><span id="time-taken-label"></span> <span id="time-taken">--:--</span></p>

                <div id="skill-breakdown" hidden>
                    <h3 id="skill-breakdown-heading"></h3>
                    <ul id="skill-breakdown-list"></ul>
                </div>

                <div id="achievements-section">
                    <h3 id="achievements-heading"></h3>
                    <ul id="achievements-list"></ul>
                </div>
            </div> <div id="review-section" style="display: none;">
                <button id="review-toggle-btn"></button>
                <div id="review-content">
                    </div>
            </div>

             <div class="result-buttons">
                 <button id="share-score-btn"><i class="fas fa-share-alt"></i> <span id="share-score-label"></span></button>
                 </div>
        </div> </div> </body>
</html>

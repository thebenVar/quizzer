<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- This page is the same for every quiz. Without ?quiz= it is the home page,
         listing the quizzes named in quizzes/registry.json. With ?quiz=<id> it runs
         that quiz, from quizzes/<id>/meta.json and questions.json; ?quiz=<id>-ans
         shows that quiz's answer key. -->

    <div id="quiz-container">
        <div id="feedback-flash" class="feedback-flash"></div>

        <a id="home-link" href="./" hidden></a>
        <img id="logo" alt="" hidden>
        <h1 id="quiz-title">Loading…</h1>
        <p id="quiz-description" hidden></p>
        <p id="quiz-load-error" class="feedback-incorrect" hidden></p>

        <ul id="quiz-list" hidden></ul>

        <!-- ?quiz=<id>-ans: the answer key (app/answerKey.js) -->
        <div id="answer-key" hidden></div>

        <div id="initial-setup" style="display: none;">
            <!-- Test mode: shown instead of the name and Start button when a test was saved part-way -->
            <div id="resume-panel" hidden>
                <p id="resume-heading"></p>
                <p id="resume-details"></p>
                <div class="resume-buttons">
                    <button type="button" id="resume-btn"></button>
                    <button type="button" id="start-over-btn"></button>
                </div>
            </div>

            <div id="name-input-area">
                 <label for="user-name" id="name-label"></label>
                 <input type="text" id="user-name" name="user-name" autocomplete="name" maxlength="80">
                 <p id="name-hint" class="setup-hint" hidden></p>
            </div>

            <div id="correction-mode-selector">
                <p id="correction-mode-label"></p>
                <label>
                    <input type="radio" name="correction" value="immediate" checked> <span id="immediate-correction-label"></span>
                </label>
                <label>
                    <input type="radio" name="correction" value="end"> <span id="delayed-correction-label"></span>
                </label>
            </div>
            <!-- Quizzes with "cohortCodes": "optional" or "required": the code the facilitator gave
                 (?code=ABC234 in the link fills it in) -->
            <div id="cohort-area" hidden>
                <label for="cohort-code" id="cohort-code-label"></label>
                <input type="text" id="cohort-code" name="cohort-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12">
                <p id="cohort-code-hint" class="setup-hint"></p>
                <p id="cohort-status" class="setup-hint" role="status" hidden></p>
            </div>

            <!-- Quizzes with "collectResults": true: the participant is told before starting -->
            <p id="results-collected-notice" class="setup-hint" hidden></p>
            <button id="start-quiz-btn" disabled>Start Quiz</button>
        </div>


        <div id="quiz-content" style="display: none;">
            <div id="quiz-header">
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <div id="header-info">
                    <span id="progress-text"></span> <div id="live-stats">
                        <span id="live-correct-count"></span>
                        <span id="live-incorrect-count"></span>
                        <span id="streak-counter"></span>
                        <div id="live-gifts"></div>
                    </div>
                    <span id="overall-timer"></span>
                </div>
            </div>

            <div id="question-view">
                <div id="question-area">
                    <p id="question-text"></p>
                </div>

                <div id="options-area">
                    </div>

                <div id="feedback-area">
                    </div>

                <div id="navigation">
                    <!-- Test mode: Back / Next (Finish on the last question) -->
                    <button type="button" id="test-back-btn" class="test-nav-btn" hidden><i class="fas fa-arrow-left"></i> <span id="test-back-label"></span></button>
                    <button id="submit-btn" style="display: none;"></button>
                    <button id="next-question-btn" style="display: none;"><span id="next-question-label"></span> <i class="fas fa-arrow-right"></i></button>
                    <button type="button" id="test-next-btn" class="test-nav-btn" hidden><span id="test-next-label"></span> <i class="fas fa-arrow-right"></i></button>
                </div>
                <p id="keyboard-hint" class="keyboard-hint" hidden></p>
            </div>

            <!-- Test mode: summary before submitting -->
            <div id="finish-screen" hidden>
                <h2 id="finish-heading" tabindex="-1"></h2>
                <p id="finish-answered"></p>
                <p id="finish-unanswered-label"></p>
                <div id="finish-unanswered-list"></div>
                <div class="finish-buttons">
                    <button type="button" id="back-to-test-btn"></button>
                    <button type="button" id="submit-test-btn"></button>
                </div>
            </div>
        </div> <div id="result-area" style="display: none;">
            <div id="score-card">
                <h2 id="result-heading"></h2>
                <p id="result-message"></p>
                <p id="result-cohort" hidden></p>
                <p><span id="final-score-label"></span> <span id="final-score">0</span> / <span id="total-possible-score">0</span></p>
                <div id="result-summary">
                    <span class="correct-count"><span id="correct-count-label"></span> <span id="correct-answers-count">0</span></span>
                    <span class="incorrect-count"><span id="incorrect-count-label"></span> <span id="incorrect-answers-count">0</span></span>
                    <span class="unanswered-count" id="unanswered-summary" hidden><span id="unanswered-count-label"></span> <span id="unanswered-answers-count">0</span></span>
                </div>
                <p id="time-taken-summary"><span id="time-taken-label"></span> <span id="time-taken">--:--</span></p>

                <div id="skill-breakdown" hidden>
                    <h3 id="skill-breakdown-heading"></h3>
                    <ul id="skill-breakdown-list"></ul>
                </div>

                <div id="achievements-section">
                    <h3 id="achievements-heading"></h3>
                    <ul id="achievements-list"></ul>
                </div>
            </div>

            <!-- Quizzes with "collectResults": true: whether the results reached the facilitators -->
            <div id="results-send" hidden>
                <p id="results-send-status" role="status"></p>
                <button type="button" id="results-retry-btn" hidden></button>
            </div>

            <div id="review-section" style="display: none;">
                <button id="review-toggle-btn"></button>
                <div id="review-content">
                    <div id="review-filter" role="group">
                        <button type="button" id="review-filter-wrong" class="review-filter-btn" aria-pressed="true"></button>
                        <button type="button" id="review-filter-all" class="review-filter-btn" aria-pressed="false"></button>
                    </div>
                    <div id="review-cards"></div>
                </div>
            </div>

             <div class="result-buttons">
                 <button type="button" id="download-results-btn"><i class="fas fa-download"></i> <span id="download-results-label"></span></button>
                 <button type="button" id="share-results-btn" hidden><i class="fas fa-share-alt"></i> <span id="share-results-label"></span></button>
                 <button id="share-score-btn"><i class="fas fa-image"></i> <span id="share-score-label"></span></button>
                 </div>
        </div> </div> </body>
</html>

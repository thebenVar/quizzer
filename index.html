<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- This page is the same for every quiz. The quiz's title, logo, labels and
         questions come from quizzes/<quiz-id>/meta.json and questions.json. -->

    <div id="quiz-container">
        <div id="feedback-flash" class="feedback-flash"></div>

        <img id="logo" alt="" hidden>
        <h1 id="quiz-title">Loading quiz…</h1>
        <p id="quiz-description" hidden></p>
        <p id="quiz-load-error" class="feedback-incorrect" hidden></p>

        <div id="initial-setup">
            <div id="name-input-area">
                 <label for="user-name" id="name-label"></label>
                 <input type="text" id="user-name" name="user-name">
            </div>

            <div id="correction-mode-selector">
                <p id="correction-mode-label"></p>
                <label>
                    <input type="radio" name="correction" value="immediate" checked> <span id="immediate-correction-label"></span>
                </label>
                <label>
                    <input type="radio" name="correction" value="end"> <span id="delayed-correction-label"></span>
                </label>
            </div>
            <button id="start-quiz-btn" disabled>Start Quiz</button>
        </div>


        <div id="quiz-content" style="display: none;">
            <div id="quiz-header">
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <div id="header-info">
                    <span id="progress-text">Question 1 / X</span> <div id="live-stats">
                        <span id="live-correct-count">✔️ 0</span>
                        <span id="live-incorrect-count">❌ 0</span>
                        <span id="streak-counter">🔥 Streak: 0</span>
                        <div id="live-gifts"></div>
                    </div>
                    <span id="overall-timer"></span>
                </div>
            </div>

            <div id="question-area">
                <p id="question-text">Loading question...</p>
            </div>

            <div id="options-area">
                </div>

            <div id="feedback-area">
                </div>

            <div id="navigation">
                <button id="submit-btn" style="display: none;">Submit Answer</button>
                <button id="next-question-btn" style="display: none;">Next Question <i class="fas fa-arrow-right"></i></button>
            </div>
        </div> <div id="result-area" style="display: none;">
            <div id="score-card">
                <h2 id="result-heading"></h2>
                <p id="result-message">Well done, <span id="result-name">User</span>!</p>
                <p>Your final score is: <span id="final-score">0</span> / <span id="total-possible-score">0</span></p>
                <div id="result-summary">
                    <span class="correct-count">Correct: <span id="correct-answers-count">0</span></span>
                    <span class="incorrect-count">Incorrect: <span id="incorrect-answers-count">0</span></span>
                </div>
                <p id="time-taken-summary">Time Taken: <span id="time-taken">--:--</span></p>

                <div id="achievements-section">
                    <h3>Achievements / Gifts Earned:</h3>
                    <ul id="achievements-list">
                        <li>No gifts earned yet.</li>
                    </ul>
                </div>
            </div> <div id="review-section" style="display: none;">
                <button id="review-toggle-btn"></button>
                <div id="review-content">
                    </div>
            </div>

             <div class="result-buttons">
                 <button id="share-score-btn"><i class="fas fa-share-alt"></i> <span id="share-score-label"></span></button>
                 </div>
        </div> </div> </body>
</html>
